name: "🎉 Feature Suggestion"
title: "[Feature] "
description: Submit a new feature idea or suggestion to us.
labels: ["Considered"]
body:
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched the [Issue list](https://github.com/Slok7565/FinalSuspect/issues) for related features and confirmed that this feature idea has never been proposed before.
          required: true
        - label: I have read and agree to this project's [Contributor Code of Conduct](https://github.com/Slok7565/FinalSuspect/blob/FinalSus/CODE_OF_CONDUCT.md).
          required: true

  - type: textarea
    attributes:
      label: Feature Description
      placeholder: Describe in detail the feature you would like to see added.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Use Case
      placeholder: Describe the use case for the feature you are suggesting.

  - type: markdown
    attributes:
      value: "Thank you for submitting your valuable idea to us!"
