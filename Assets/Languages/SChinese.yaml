# 主页风格
MainMenuStyle.Title_MiraHQ: "<color=#cecdfd>逐光寻晓<size=80%>（FS经典背景）</size></color>"
MainMenuStyle.Author_MiraHQ: "KpCam"
MainMenuStyle.Description_MiraHQ: "随着时间的推移，北半球的冬天迎来尾声，春意正在各处复苏。\n眺望米拉的雪景，内心中的回忆是否唤醒？暖流依旧心中流淌。\n无论嫌疑最终落在谁身，无论真理最后破碎于谁手，\n在焕然一新的体验中，头脑风暴，留下全新的快乐回忆。\n玩游戏，开心最重要！！！<size=80%>\n\n命名：一念旧情丶</size>"
MainMenuStyle.Title_Security: "<color=#cdfffd>赤心炽爱<size=80%>（TONEX经典背景）</size></color>"
MainMenuStyle.Author_Security: "KpCam"
MainMenuStyle.Description_Security: "我们不会就此跌下、不会就此放弃、不会让玩家失望、更不会停止进步\n若有人冷眼相待，我们会证明给所有人看！\n伴着热爱，我们再次起航<size=80%>\n\n命名：Slok</size>"
MainMenuStyle.Title_NewYear: "<color=#ff0000>祉缘谐乐</color><color=#ffff00><size=80%>（新春特别节目）</size></color>"
MainMenuStyle.Author_NewYear: "小黄117"
MainMenuStyle.Description_NewYear: "祉，祝予福    缘，织于心\n谐，连与情    乐，安喻人\n挚缘，创谐乐  致远，谐得乐\n至元，皆怀乐  只愿，人皆乐\n愿每个人在新的一年都能寻得自己的道路\n带着我们的祝福，勇往直前，追寻属于自己的人生吧！<size=80%>\n\n命名：Slok</size>"
MainMenuStyle.Title_MiraStudio: "<color=#cdfffd>极致演播厅</color><color=#ffff00><size=80%>（新春特别节目）</size></color>"
MainMenuStyle.Author_MiraStudio: "小黄117"
MainMenuStyle.Description_MiraStudio: "\"——花开似浪，温柔如风，愿大家心海如风，事事如意\"\n\"——春风浩荡，浪涌千里，愿大家勇立潮头，蒸蒸日上\"\n\"——欢迎来到XtremeWave 极致狂澜——新春特别节目！\"<size=80%>\n\n命名：Slok</size>"
